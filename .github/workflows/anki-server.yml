name: Anki Cloud Server

on:
  repository_dispatch:
    types: [start-anki, start_anki]
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Tempo de duração da sessão em minutos'
        required: false
        default: '30'

jobs:
  run-anki:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Tempo máximo permitido pelo GitHub Actions

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências do Sistema (Xvfb, Openbox, MPV & Bibliotecas Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mpv libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxtst6 libxkbfile1 \
            libegl1 libopengl0 libgl1 libgl1-mesa-dri zstd curl jq \
            libasound2t64 || sudo apt-get install -y xvfb openbox mpv libxcb-cursor0 \
            libxcb-xinerama0 libnss3 libegl1 libxkbcommon-x11-0 libgl1-mesa-dri zstd curl jq libasound2

      - name: Instalar Anki Oficial Mais Recente (Linux x86_64)
        run: |
          echo "Buscando release oficial mais recente do Anki..."
          ANKI_URL=$(curl -s https://api.github.com/repos/ankitects/anki/releases/latest | jq -r '.assets[] | select(.name | test("linux-x86_64.tar.zst$")) | .browser_download_url')
          echo "Baixando: $ANKI_URL"
          curl -L "$ANKI_URL" -o /tmp/anki.tar.zst
          mkdir -p /tmp/anki-extracted
          tar -I zstd -xf /tmp/anki.tar.zst -C /tmp/anki-extracted/
          ls -la /tmp/anki-extracted/
          ANKI_DIR=$(find /tmp/anki-extracted -type f -name "install.sh" -exec dirname {} \; | head -1)
          if [ -z "$ANKI_DIR" ]; then
            echo "Error: Could not find install.sh in extracted Anki"
            exit 1
          fi
          echo "Diretório de instalação encontrado: $ANKI_DIR"
          cd "$ANKI_DIR"
          sudo ./install.sh
          which anki
          anki --version || true

      - name: Instalar Ngrok CLI
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

      - name: Iniciar Anki Cloud com AnkiMCP e Sincronização
        env:
          PYTHONUNBUFFERED: "1"
          ANKI_SOFTWAREOPENGL: "1"
          QMLSCENE_DEVICE: "softwarecontext"
          LIBGL_ALWAYS_SOFTWARE: "1"
          ANKIWEB_USER: ${{ secrets.ANKIWEB_USER }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
          ANKI_MCP_API_KEY: ${{ secrets.ANKI_MCP_API_KEY }}
          DURATION_MINUTES: ${{ github.event.client_payload.duration_minutes || inputs.duration_minutes || 30 }}
        run: |
          python -u scripts/run_anki_cloud.py

      - name: Diagnóstico Pós-Execução (Logs Internos AnkiMCP e Ngrok)
        if: always()
        run: |
          echo "=== Logs internos do AnkiMCP (ankimcp.log) ==="
          cat ~/.local/share/Anki2/addons21/anki_mcp_server/user_files/ankimcp.log 2>/dev/null || echo "Nenhum ankimcp.log encontrado"
          echo "=== Logs do Addon Manager do Anki ==="
          ls -la ~/.local/share/Anki2/logs/ 2>/dev/null || true
          cat ~/.local/share/Anki2/logs/*.log 2>/dev/null || true
          echo "=== Logs do Ngrok ==="
          cat /tmp/ngrok.log 2>/dev/null || echo "Nenhum /tmp/ngrok.log encontrado"
          echo "=== Logs do Xvfb ==="
          cat /tmp/xvfb.log 2>/dev/null || echo "Nenhum /tmp/xvfb.log encontrado"
          echo "=== Logs do Openbox ==="
          cat /tmp/openbox.log 2>/dev/null || echo "Nenhum /tmp/openbox.log encontrado"
